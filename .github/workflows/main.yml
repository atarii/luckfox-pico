name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "senpai"

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          
      - name: checkout
        uses: actions/checkout@v4
      
      - name: Cache rootfs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            build/
          # Fixed: Added fallback if packages/ is empty
          key: rootfs-${{ hashFiles('rootfs.sh') }}-${{ github.run_id }}
          restore-keys: |
            rootfs-

      - name: build rootfs
        # Note: Ensure your rootfs.sh includes the 'find' command to delete .pyc files
        run: sudo ./rootfs.sh
      
      - name: upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-alpine
          path: output/rootfs-alpine.tar.gz

  build-system:
    strategy:
      matrix:
        device: [ pico-plus ]
    runs-on: ubuntu-latest
    needs: build-rootfs
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      
      - name: ccache setup
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
      
      - name: download rootfs
        uses: actions/download-artifact@v4 # Matched version with build-rootfs
        with:
          name: rootfs-alpine
          
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-
      
      - name: update apt
        run: sudo apt update
      
      - name: install deps
        run: |
          sudo apt install -y \
          git ssh make gcc gcc-multilib g++-multilib \
          module-assistant expect g++ gawk texinfo libssl-dev \
          bison flex fakeroot cmake unzip gperf autoconf \
          device-tree-compiler libncurses5-dev pkg-config bc \
          python-is-python3 passwd openssl openssh-server \
          openssh-client vim file cpio rsync

      - name: Cache buildroot downloads
        uses: actions/cache
